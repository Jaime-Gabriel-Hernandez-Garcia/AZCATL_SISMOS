services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: azcatl-sismos-web
    restart: always
    ports:
      - "80:80"
      - "3000:80"
    volumes:
      - ./src:/var/www/html:rw
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=datawarehouse
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  db:
    image: postgres:17
    container_name: azcatl-sismos-db
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/00-datawarehouse_tables.sql:/docker-entrypoint-initdb.d/00-datawarehouse_tables.sql:ro
      - ./sql/01-dim_zonas.sql:/docker-entrypoint-initdb.d/01-dim_zonas.sql:ro
      - ./sql/02-dim_tiempo.sql:/docker-entrypoint-initdb.d/02-dim_tiempo.sql:ro
      - ./sql/03-dim_sismos.sql:/docker-entrypoint-initdb.d/03-dim_sismos.sql:ro
      - ./sql/04-dim_economia.sql:/docker-entrypoint-initdb.d/04-dim_economia.sql:ro
      - ./sql/05-fact_impacto_sismos_imputed.sql:/docker-entrypoint-initdb.d/05-fact_impacto_sismos_imputed.sql:ro
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=datawarehouse
      - POSTGRES_HOST_AUTH_METHOD=trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d datawarehouse"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
